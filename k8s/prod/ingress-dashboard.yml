apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
  labels:
    ingress-controller: alb
  name: qdrant-dashboard-ingress
  namespace: prod-ns
spec:
  ingressClassName: alb
  rules:
    - host: qdrant-dashboard.atominnolab.com
      http:
        paths:
          - backend:
              service:
                name: qdrant-headless
                port:
                  number: 6333
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - qdrant-dashboard.atominnolab.com
      secretName: tls-atominnolab.com
